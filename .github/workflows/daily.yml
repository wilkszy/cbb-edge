name: Daily CBB Edge refresh

on:
  push:
    branches: [main]
    paths: ["data/kenpom.json"]   # fires when your computer pushes fresh ratings
  schedule:
    - cron: "17 21 * * *"         # ~4:17 PM ET: refresh lines before evening tips
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build dashboard
        if: hashFiles('data/kenpom.json') != ''
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python src/edge.py
      - name: Commit results
        run: |
          git config user.name "cbb-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Slate update $(date -u +%F' '%H:%M)"
          git pull --rebase --quiet
          git push
