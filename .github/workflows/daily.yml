name: Daily CBB Edge refresh

on:
  schedule:
    - cron: "17 14 * * *"   # ~9:17 AM ET: morning lines + overnight KenPom update
    - cron: "17 21 * * *"   # ~4:17 PM ET: refresh lines before evening tips
  workflow_dispatch: {}      # "Run workflow" button for manual refreshes

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build dashboard
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python src/edge.py
      - name: Commit results
        run: |
          git config user.name "cbb-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Slate update $(date -u +%F' '%H:%M)"
          git push
